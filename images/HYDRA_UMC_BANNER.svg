<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">HYDRA-UMC-OS-REBUILDER</title><desc id="desc">HYDRA-UMC-OS-REBUILDER | HYDRA-UMC ecosystem project banner</desc>
