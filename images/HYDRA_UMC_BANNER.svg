  <rect width="1200" height="400" fill="url(#bg)"/><g fill="none" stroke="#00E5FF" stroke-width="1" opacity=".25"><path d="M0 100H200L250 150H600"/><path d="M1200 300H1000L950 250H600"/></g>
  <g transform="translate(205 185)" filter="url(#g)"><path d="M-60,40 -80,-20 -40,-60 0,-40 40,-60 80,-20 60,40Z" fill="none" stroke="#00E5FF" stroke-width="4"/><circle cy="-40" r="10" fill="#00E5FF"/><circle cx="-40" cy="-60" r="8" fill="#00E5FF"/><circle cx="40" cy="-60" r="8" fill="#00E5FF"/><rect x="-30" y="40" width="60" height="15" rx="2" fill="#00E5FF" opacity=".8"/>
