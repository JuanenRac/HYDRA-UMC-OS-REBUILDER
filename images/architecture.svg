<title id="t">HYDRA-UMC-OS-REBUILDER architecture</title>
<desc id="d">HYDRA-UMC-OS-REBUILDER resolves the latest real version of each ecosystem project from GitHub, builds a CM5 image on Linux, writes the first-boot configuration, freezes profiles and can install remotely over SSH.</desc>
